# rp-web: serves the Blazor WebAssembly PWA and forwards API traffic to rp-api.
#
#   /api/*      → rp-api:8080   (REST API)
#   /hubs/*     → rp-api:8080   (SignalR WebSockets: kitchen display, live orders)
#   /uploads/*  → rp-api:8080   (logos, menu images)
#   /health     → rp-api:8080   (end-to-end check: web → api → db)
#   /web-health → 200           (container liveness, independent of the API)
#   /downloads/ → /srv/downloads (desktop installers, mounted read-only from /root/downloads/restaurant)
#   everything else → the single-page app (the Blazor router handles /app/... client-side)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Logo uploads are capped at 5 MB by the API; leave headroom for multipart overhead.
    client_max_body_size 8m;

    # Docker's embedded DNS, re-resolved every 10s: during a blue-green deploy rp-api is replaced
    # by a new container with a new IP, and a static upstream would keep pointing at the old one.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # While rp-api is down its name doesn't exist and Docker forwards the lookup to the host's DNS,
    # which takes ~4s to fail. Fail fast instead, so the app switches to its offline copy quickly.
    resolver_timeout 1s;
    set $rp_api http://rp-api:8080;

    location = /web-health {
        access_log off;
        default_type application/json;
        return 200 '{"web":"ok"}';
    }

    location = /health {
        proxy_pass $rp_api;
        access_log off;
    }

    location /api/ {
        proxy_pass $rp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends to the X-Forwarded-For set by Nginx Proxy Manager, so the API sees the real client
        # (it trusts these headers only when ReverseProxy__TrustForwardedHeaders=true).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # SignalR (kitchen display, order updates): WebSockets need the Upgrade headers and long timeouts.
    location /hubs/ {
        proxy_pass $rp_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /uploads/ {
        proxy_pass $rp_api;
        proxy_set_header Host $host;
        expires 7d;
    }

    # Desktop installers (docs/DEPLOYMENT.md, "Desktop app releases"). Files only, no listing; a missing
    # file is a 404, never the app shell.
    location ^~ /downloads/ {
        alias /srv/downloads/;
        autoindex off;
        default_type application/octet-stream;
        types {
            application/json json;
        }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }

    # The publish output ships pre-compressed .gz copies of the framework files; serve those directly.
    gzip_static on;

    # Fingerprinted framework files (name.<hash>.ext) never change — cache them for a long time.
    # (Quoted: nginx would otherwise read the `{` of the regex as the start of the block.)
    location ~* "^/_framework/.+\.[a-z0-9]{10,}\.(js|wasm|dat|dll|pdb|json)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /_framework/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The service worker and its asset manifest decide when an installed PWA updates: never cache them.
    location ~ ^/(service-worker\.js|service-worker-assets\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        types { application/javascript js; application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    location / {
        # index.html must never be cached, or users keep running an old app after a deploy.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm application/manifest+json image/svg+xml;
    gzip_min_length 1024;
}
